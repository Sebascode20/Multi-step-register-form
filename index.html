<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Interactive multi-step registration form UI with user information input, topic selection, and summary confirmation screen. Built with a modern dark interface design and smooth onboarding experience."
    />
    <meta
      name="keywords"
      content="multi step form, registration form ui, onboarding form, signup form, dark ui design, stepper form, interactive form, frontend challenge, web form design, user registration, topic selection ui, summary confirmation screen"
    />
    <meta property="og:title" content="Multi Step Registration Form UI" />
    <meta
      property="og:description"
      content="Responsive multi-step onboarding form with registration, topic selection and summary confirmation screens."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./preview.png" />

    <link
      rel="icon"
      href="./resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Multi-step Register Form | devChallenges.io</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
  </head>
  <body>
    <main>
      <div class="form-wrapper">
        <form class="card form-active register">
          <legend class="register__title">Register</legend>
          <div class="register__name">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              title="The name field only accepts letters and spaces"
              pattern="^[A-Za-zÑñÁáÉéÍíÓóÚúÜü\s]+$"
              placeholder="Enter your name"
              required
            />
          </div>
          <div class="register__email">
            <label for="email">Email</label>
            <input
              type="text"
              id="email"
              name="email"
              title="Invalid email address"
              pattern="^[a-z0-9]+(\.[_a-z0-9]+)*@[a-z0-9\-]+(\.[a-z0-9\-]+)*(\.[a-z]{2,15})$"
              placeholder="Example@gmail.com"
              required
            />
          </div>

          <input
            class="register__btn"
            id="register-btn"
            type="button"
            value="Continue"
          />
        </form>
        <div class="available step-container">
          <p class="step-text">Step 1 of 3</p>
          <nav class="step-indicator">
            <ol>
              <li class="step active"></li>
              <li class="step"></li>
              <li class="step"></li>
            </ol>
          </nav>
        </div>
        <form class="card topics">
          <legend class="topics__title">
            Which topics you are interested in?
          </legend>
          <input
            type="checkbox"
            name="software-development"
            id="software"
            value="Software Development"
          />
          <label for="software">Software Development</label>
          <input
            type="checkbox"
            name="user-experience"
            id="ux"
            value="User Experience"
          />
          <label for="ux">User Experience</label>
          <input
            type="checkbox"
            name="graphic-design"
            id="graphic"
            value="Graphic Design"
          />
          <label for="graphic">Graphic Design</label>
          <input
            class="topics__btn"
            id="topics-btn"
            type="button"
            value="Continue"
          />
        </form>
        <div class="step-container">
          <p class="step-text">Step 2 of 3</p>
          <nav class="step-indicator">
            <ol>
              <li class="step"></li>
              <li class="step"></li>
              <li class="step"></li>
            </ol>
          </nav>
        </div>
        <article class="card summary">
          <h2 class="summary__title">Summary</h2>
          <p id="summary__name">
            <span class="name">Name: </span>Emily Johnson
          </p>
          <p id="summary__email">
            <span class="email">Email: </span>emily@emilyjohnsonstl.com
          </p>
          <h3>Topics:</h3>
          <ul id="topics"></ul>
          <button class="summary__btn" id="btn-confirm" type="button">
            Confirm
          </button>
        </article>
        <div class="step-container">
          <p class="step-text">Step 3 of 3</p>
          <nav class="step-indicator">
            <ol>
              <li class="step"></li>
              <li class="step"></li>
              <li class="step"></li>
            </ol>
          </nav>
        </div>
      </div>
    </main>
    <footer class="author-info">
      Coded by <a href="#">Sebastian Aguiñada</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </footer>
    <script src="./js/main.js"></script>
  </body>
</html>
